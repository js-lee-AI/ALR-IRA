[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "alr-ira"
dynamic = ["version"]
description = "Target-rollout labels and in-rollout anchors for training block drafters on a fixed corpus"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jungseob Lee" }]
keywords = ["speculative decoding", "draft model", "knowledge distillation", "vision-language models"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The label and anchor logic runs on numpy alone, so `import alr_ira` works on any laptop.
# The GPU training and evaluation code in pipeline/ needs the train extra.
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
train = [
    "torch>=2.5", "transformers>=4.57,<5", "accelerate>=1.0", "datasets>=3.0", "einops", "safetensors",
    "Pillow", "pydantic>=2,<3", "tqdm", "qwen-vl-utils",
]
plot = ["matplotlib>=3.5"]
test = ["pytest>=8"]

[project.scripts]
alr-ira = "alr_ira.cli:main"

[project.urls]
Homepage = "https://github.com/js-lee-AI/ALR-IRA"
Issues = "https://github.com/js-lee-AI/ALR-IRA/issues"

[tool.setuptools.dynamic]
version = { attr = "alr_ira.__version__" }

[tool.setuptools.packages.find]
include = ["alr_ira*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a CUDA device and the train extra"]
addopts = "-m 'not gpu'"
